[package]
name = "burrmill"
version = "0.0.1"
description = "SQL over sealed Parquet segments with exact integer arithmetic and refuse-on-overflow."
keywords = ["sql", "parquet", "arrow", "query-engine", "blockchain"]
categories = ["database"]
readme = "../../README.md"
# 2024: DefaultPhysicalPlanner uses let-chains. rust-version is 1.95.
edition = "2024"
rust-version.workspace = true
license.workspace = true
repository.workspace = true

# **The default graph stays short.** Arrow and Parquet are rented permanently (RFC-0044 §4.2).
# DataFusion is the optional host planner (roadmap 6.0, route C): component crates plus an owned
# physical planner, off unless the consumer enables `datafusion`. DuckDB never enters this crate.
# Features are named here, not left to unification: the bench's stock arm pulls the umbrella crate,
# which had been lending this one `unicode_expressions` (SUBSTRING) that a consumer would not get.
# `recursive_protection` grows the stack for deep expressions rather than aborting the process.
[features]
default = []
datafusion = [
    "dep:async-trait",
    "dep:bytes",
    "dep:chrono",
    "dep:futures",
    "dep:indexmap",
    "dep:itertools",
    "dep:log",
    "dep:object_store",
    "dep:serde_json",
    "dep:tokio",
    "dep:arrow-schema",
    "dep:datafusion-catalog",
    "dep:datafusion-common",
    "dep:datafusion-datasource",
    "dep:datafusion-datasource-parquet",
    "dep:datafusion-execution",
    "dep:datafusion-expr",
    "dep:datafusion-functions",
    "dep:datafusion-functions-aggregate",
    "dep:datafusion-functions-nested",
    "dep:datafusion-functions-window",
    "dep:datafusion-optimizer",
    "dep:datafusion-physical-expr",
    "dep:datafusion-physical-optimizer",
    "dep:datafusion-physical-plan",
    "dep:datafusion-session",
    "dep:datafusion-sql",
]

[dependencies]
arrow.workspace = true
parquet.workspace = true
rustc-hash.workspace = true
hashbrown.workspace = true
rayon.workspace = true
# `visitor` for `inspect`, the AST walk that answers what a statement reaches (roadmap 6.7).
sqlparser = { workspace = true, features = ["visitor"] }

async-trait = { version = "0.1", optional = true }
bytes = { version = "1", optional = true }
chrono = { version = "0.4", default-features = false, features = ["clock"], optional = true }
futures = { version = "0.3", optional = true }
indexmap = { version = "2", optional = true }
itertools = { version = "0.14", optional = true }
log = { version = "0.4", optional = true }
object_store = { version = "0.12", default-features = false, optional = true }
serde_json = { version = "1", optional = true }
tokio = { version = "1", features = ["rt-multi-thread", "sync"], optional = true }
arrow-schema = { version = "59", default-features = false, optional = true }
datafusion-catalog = { version = "=55.0.0", default-features = false, optional = true }
datafusion-common = { version = "=55.0.0", default-features = false, features = ["recursive_protection"], optional = true }
datafusion-datasource = { version = "=55.0.0", default-features = false, optional = true }
datafusion-datasource-parquet = { version = "=55.0.0", default-features = false, optional = true }
datafusion-execution = { version = "=55.0.0", default-features = false, optional = true }
datafusion-expr = { version = "=55.0.0", default-features = false, features = ["recursive_protection"], optional = true }
datafusion-functions = { version = "=55.0.0", default-features = false, features = ["datetime_expressions", "encoding_expressions", "math_expressions", "regex_expressions", "string_expressions", "unicode_expressions"], optional = true }
datafusion-functions-aggregate = { version = "=55.0.0", default-features = false, optional = true }
datafusion-functions-nested = { version = "=55.0.0", default-features = false, optional = true }
datafusion-functions-window = { version = "=55.0.0", default-features = false, optional = true }
datafusion-optimizer = { version = "=55.0.0", default-features = false, features = ["recursive_protection"], optional = true }
datafusion-physical-expr = { version = "=55.0.0", default-features = false, features = ["recursive_protection"], optional = true }
datafusion-physical-optimizer = { version = "=55.0.0", default-features = false, features = ["recursive_protection"], optional = true }
datafusion-physical-plan = { version = "=55.0.0", default-features = false, optional = true }
datafusion-session = { version = "=55.0.0", default-features = false, optional = true }
datafusion-sql = { version = "=55.0.0", default-features = false, features = ["recursive_protection", "unicode_expressions"], optional = true }

# Test-only. The seal-layout canary writes throwaway segment directories, and a canary that leaves
# litter in /tmp on every run is one people start ignoring.
[dev-dependencies]
tempfile = "3"
# Already normal dependencies; repeated here because an integration test links the crate and not its
# graph. The generated-fold tests write their own segments and vary the thread count on purpose.
arrow.workspace = true
parquet.workspace = true
rayon.workspace = true
# The parity corpus in a standard format (roadmap 2.3). A dev-dependency, so it never reaches the
# shipped graph, and the .slt files stay runnable by any other engine's runner - which is the whole
# point of not inventing a format.
sqllogictest = "0.28"

[[test]]
name = "df_engine"
path = "tests/df_engine.rs"
required-features = ["datafusion"]

[[test]]
name = "df_checked"
path = "tests/df_checked.rs"
required-features = ["datafusion"]

[[test]]
name = "df_fold"
path = "tests/df_fold.rs"
required-features = ["datafusion"]

[[test]]
name = "df_lambda"
path = "tests/df_lambda.rs"
required-features = ["datafusion"]

[[test]]
name = "df_rangejoin"
path = "tests/df_rangejoin.rs"
required-features = ["datafusion"]

[[test]]
name = "df_topn"
path = "tests/df_topn.rs"
required-features = ["datafusion"]

[[test]]
name = "df_functions"
path = "tests/df_functions.rs"
required-features = ["datafusion"]
