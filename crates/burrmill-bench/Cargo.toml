[package]
name = "burrmill-bench"
version = "0.0.1"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false

# **The oracles live here and nowhere else.** DuckDB and DataFusion are the incumbents Burrmill is
# measured against, so they must never reach the shipped library's dependency graph - not for the
# licence audit, not for the build-time numbers, and not for the C++-free claim. `publish = false`
# plus a separate member is that rule expressed as a manifest rather than as a note in a README.
[dependencies]
# `datafusion` for `df-fold`, the 6.3 memory gate on the hosted path.
burrmill = { path = "../burrmill", features = ["datafusion"] }
arrow.workspace = true
parquet.workspace = true
datafusion = "55"
duckdb = { version = "=1.10504.0", features = ["bundled"] }
# duckdb-rs's own Arrow, with `ipc` switched on, so `encode-parity` can move DuckDB's batches into
# Burrmill's Arrow version unchanged. Pinned to what duckdb-rs resolves; bench-only.
arrow58 = { package = "arrow", version = "=58.4.0", default-features = false, features = ["ipc"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }
anyhow = "1"
tempfile = "3"
# Only for getrusage: a true peak RSS. The bench is publish = false, so this stays out of the
# shipped graph like every other dependency in here.
libc = "0.2"
# For the order-dependence probe, which varies the pool size inside one process.
rayon.workspace = true
# The same corpus, pointed at the other engine. This is the reason 2.3 uses a standard format
# instead of a bespoke one.
sqllogictest = "0.28"
# Experiment A4: parsing a real workload to count the plan shapes it produces.
sqlparser.workspace = true
walkdir = "2"
# `df-views`: a custom DataFusion table provider over an explicit segment list, and the nest's
# schema.json for the tables it declares but has not sealed.
object_store = "0.13"
futures = "0.3"
async-trait = "0.1"
bytes = "1"
serde_json = "1"

[features]
# A counting global allocator: peak live heap beside peak RSS, to tell bytes held from bytes the
# allocator has freed and kept. Off by default; it costs an atomic per allocation.
alloc-stats = []
