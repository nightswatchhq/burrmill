name: ci

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always

jobs:
  fmt:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@a5f673d0ba8626c3977bb416a1612774bc82181b # 1.95.0
        with:
          components: rustfmt
      - run: cargo fmt --all --check

  # The library both ways: the default graph is pure Rust and must build on its own, and
  # `datafusion` is what nuthatch embeds.
  burrmill:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@a5f673d0ba8626c3977bb416a1612774bc82181b # 1.95.0
        with:
          components: clippy
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          key: burrmill
          cache-on-failure: true
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: clippy (default)
        run: cargo clippy --locked -p burrmill --all-targets -- -D warnings
      - name: clippy (datafusion)
        run: cargo clippy --locked -p burrmill --all-targets --features datafusion -- -D warnings
      - name: test (default)
        run: cargo test --locked -p burrmill
      - name: test (datafusion)
        run: cargo test --locked -p burrmill --features datafusion

  # Lint only: the bench has no tests, and its own job keeps the bundled DuckDB build off the
  # library's critical path.
  bench:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@a5f673d0ba8626c3977bb416a1612774bc82181b # 1.95.0
        with:
          components: clippy
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          key: bench
          cache-on-failure: true
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: clippy
        run: cargo clippy --locked -p burrmill-bench --all-targets --all-features -- -D warnings
